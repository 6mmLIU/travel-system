<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${status == null ? '未知错误' : (status + ' 错误')}">错误页面</title>
    <style>
        /* 整页背景 */
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f8ff; /* AliceBlue */
            font-family: "Microsoft YaHei", Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        /* 错误卡片 */
        .error-card {
            position: relative;
            width: 90%;
            max-width: 420px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 6px 18px rgba(0,102,204,0.1);
            overflow: hidden;
            animation: fadeIn 0.5s ease-out;
        }
        /* 顶部彩带 */
        .error-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, #0066cc 0%, #3399ff 100%);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        /* 内容区 */
        .inner {
            padding: 30px 20px;
            text-align: center;
        }
        .error-title {
            font-size: 24px;
            margin-bottom: 15px;
            color: #0066cc;
        }
        .error-desc {
            font-size: 14px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        /* “回家”按钮 */
        .btn-home {
            display: inline-block;
            padding: 10px 28px;
            background: linear-gradient(90deg, #3399ff 0%, #66b2ff 100%);
            color: #fff;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 12px rgba(51,153,255,0.3);
        }
    </style>
</head>
<body>
<div class="error-card">
    <div class="inner">
        <div th:switch="${status}">
            <div th:case="403">
                <div class="error-title">权限不足 😕</div>
                <div class="error-desc">抱歉，你没有权限访问此页面。</div>
            </div>
            <div th:case="404">
                <div class="error-title">404 - 页面走丢了 🕵️‍♂️</div>
                <div class="error-desc">要访问的页面不见了，是不是输错地址啦？</div>
            </div>
            <div th:case="500">
                <div class="error-title">500 - 服务器打盹中 ☕</div>
                <div class="error-desc">服务器开小差了，请稍后再试。</div>
            </div>
            <div th:case="400">
                <div class="error-title">400 - 请求有误 🚧</div>
                <div class="error-desc">参数或请求不对，请检查后重试。</div>
            </div>
            <div th:case="*">
                <div class="error-title">未知错误 🤷‍♀️</div>
                <div class="error-desc">出了一点小意外，请回主界面试试。</div>
            </div>
        </div>
        <a th:href="@{/users/index}" class="btn-home">🏠 返回主界面</a>
    </div>
</div>
</body>
</html>
