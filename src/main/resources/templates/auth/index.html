<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head>
    <meta charset="UTF-8">
    <title>主界面</title>
    <style>
        :root{--primary:#0d6efd;--gap:12px;--btn-h:32px}
        body{font-family:"Microsoft YaHei","微软雅黑",sans-serif;background:#f5f7fa;margin:0}
        /* 导航栏 */
        .navbar{display:flex;justify-content:space-between;align-items:center;
            background:#fff;padding:10px 20px;border-bottom:1px solid #eee}
        .title{font-size:26px;font-weight:900;color:var(--primary)}
        .nav-links{display:flex;gap:var(--gap)}
        .btn{height:var(--btn-h);padding:0 16px;border:2px solid var(--primary);border-radius:20px;
            background:#fff;color:var(--primary);font-size:14px;cursor:pointer;text-decoration:none;
            display:flex;align-items:center;justify-content:center;transition:all .25s}
        .btn:hover{background:var(--primary);color:#fff}
        /* 主体 */
        .container{max-width:1200px;margin:30px auto;display:flex;gap:20px}
        .left{flex:3;background:#fff;padding:20px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.05)}
        .right{flex:2;display:flex;flex-direction:column;gap:20px}
        .card{background:#fff;padding:20px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.05)}
        table{width:100%;border-collapse:collapse}
        th,td{padding:8px;border-bottom:1px solid #eee;text-align:left}
        th{background:#f8f9fb}
        .small-btn{height:28px;padding:0 12px;border:1px solid var(--primary);
            background:#fff;color:var(--primary);border-radius:14px;font-size:12px;cursor:pointer}
        .small-btn:hover{background:var(--primary);color:#fff}
        /* 搜索框样式 */
        .search-form{display:flex;gap:8px;margin:12px 0}
        .search-input{flex:1;padding:6px 10px;border:1px solid #ccc;border-radius:4px;font-size:14px}
        footer{text-align:center;color:#888;margin:40px 0 10px}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
</head>
<body>

<!-- 导航 -->
<div class="navbar">
    <div class="title">旅游管理系统</div>
    <div class="nav-links">
        <a href="/tour-lines/all"  class="btn">线路管理</a>
        <a href="/members"         class="btn">会员管理</a>
        <a href="/users/favorites" class="btn">个人中心</a>
        <a th:href="@{/logout}"    class="btn">退出登录</a>
    </div>
</div>

<!-- 主内容 -->
<div class="container">
    <!-- 左侧 -->
    <div class="left">
        <h2>路线可视化图表</h2>
        <div id="main-chart" style="width:100%;height:360px"></div>
    </div>

    <!-- 右侧 -->
    <div class="right">
        <div class="card">
            <h3 style="margin-top:0">已发布的旅游线路</h3>

            <!-- 搜索表单：改为提交到 /users/index -->
            <form th:action="@{/users/index}" method="get" class="search-form">
                <input type="text"
                       name="keyword"
                       th:value="${keyword}"
                       placeholder="请输入线路目的地"
                       class="search-input"/>
                <button type="submit" class="small-btn">搜索</button>
            </form>

            <table th:if="${publishedLines!=null}">
                <thead>
                <tr><th>线路名称</th><th>目的地</th><th>价格</th><th style="width:120px">操作</th></tr>
                </thead>
                <tbody>
                <tr th:each="line:${publishedLines}">
                    <td th:text="${line.title}">title</td>
                    <td th:text="${line.destination}">dest</td>
                    <td th:text="${line.price}">price</td>
                    <td>
                        <form th:action="@{|/users/favorites/${line.id}/toggle|}" method="post" style="display:inline">
                            <button type="submit" class="small-btn">收藏</button>
                        </form>
                        <a th:href="@{|/tour-lines/${line.id}|}" class="small-btn" style="margin-left:6px">详情</a>
                    </td>
                </tr>
                </tbody>
            </table>
            <p th:if="${publishedLines==null || publishedLines.isEmpty()}">暂无已发布线路。</p>
        </div>
    </div>
</div>

<footer>© 2025 旅游管理系统</footer>

<!-- ECharts 图表数据 -->
<script>
    const chart = echarts.init(document.getElementById('main-chart'));
    chart.setOption({
        tooltip:{trigger:'axis'},
        xAxis:{type:'category',data:[]},
        yAxis:{type:'value'},
        series:[{type:'bar',data:[],itemStyle:{color:'#66ccff'}}]
    });
    fetch('/api/charts/city-count')
        .then(r=>r.json())
        .then(d=>chart.setOption({
            xAxis:{data:d.map(i=>i.city)},
            series:[{data:d.map(i=>i.count)}]
        }));
</script>
</body>
</html>
