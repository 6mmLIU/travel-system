<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head>
    <meta charset="UTF-8">
    <title>我的收藏</title>
    <style>
        body{font-family:"Microsoft YaHei","微软雅黑",sans-serif;margin:0;padding:0;background:#f5f7fa}
        .container{max-width:1000px;margin:40px auto;padding:20px;background:#fff;border-radius:8px;
            box-shadow:0 2px 8px rgba(0,0,0,.05)}
        h1{margin-top:0;color:#0d6efd;text-align:center}
        table{width:100%;border-collapse:collapse;margin-top:20px}
        th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}
        th{background:#f0f8ff}
        .back-link{display:inline-block;margin-top:20px;color:#0d6efd;text-decoration:none}
        .back-link:hover{text-decoration:underline}
    </style>
</head>
<body>
<div class="container">
    <h1>我的收藏路线</h1>

    <div th:if="${favorites == null || favorites.isEmpty()}">
        <p>你还没有收藏任何线路，快去首页挑选喜欢的线路吧！</p>
    </div>

    <div th:if="${favorites != null && !favorites.isEmpty()}">
        <table>
            <thead>
            <tr><th>线路名称</th><th>目的地</th><th>价格</th><th>操作</th></tr>
            </thead>
            <tbody>
            <tr th:each="line : ${favorites}">
                <td th:text="${line.title}">线路</td>
                <td th:text="${line.destination}">目的地</td>
                <td th:text="${line.price}">价格</td>
                <td>
                    <form th:action="@{|/users/favorites/${line.id}/toggle|}" method="post" style="display:inline">
                        <button type="submit">取消收藏</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <a href="/users/index" class="back-link">← 返回首页</a>
</div>
</body>
</html>
